<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" rx="16" fill="#0B3D2E"/>

  <text x="500" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#4ADE80" text-anchor="middle">06 · AUGMENT</text>

  <!-- Left panel: Session-based AI -->
  <rect x="40" y="100" width="440" height="560" rx="12" fill="#072A1E" stroke="#1a5c40" stroke-width="1"/>
  <text x="260" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ef4444" text-anchor="middle">Session-based AI</text>
  <text x="260" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888" text-anchor="middle">Every person re-explains the product</text>

  <!-- Person 1 -->
  <circle cx="130" cy="230" r="18" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1"/>
  <text x="130" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ef4444" text-anchor="middle">PM</text>
  <rect x="170" y="210" width="260" height="40" rx="6" fill="#ef4444" opacity="0.08" stroke="#ef4444" stroke-width="1" stroke-opacity="0.2"/>
  <text x="300" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="middle">"We sell to mid-market SaaS...</text>
  <text x="300" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="middle">our main competitor is..."</text>

  <!-- Person 2 -->
  <circle cx="130" cy="310" r="18" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1"/>
  <text x="130" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ef4444" text-anchor="middle">PM</text>
  <rect x="170" y="290" width="260" height="40" rx="6" fill="#ef4444" opacity="0.08" stroke="#ef4444" stroke-width="1" stroke-opacity="0.2"/>
  <text x="300" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="middle">"We sell to mid-market SaaS...</text>
  <text x="300" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="middle">our main competitor is..."</text>

  <!-- Person 3 -->
  <circle cx="130" cy="390" r="18" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1"/>
  <text x="130" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ef4444" text-anchor="middle">PM</text>
  <rect x="170" y="370" width="260" height="40" rx="6" fill="#ef4444" opacity="0.08" stroke="#ef4444" stroke-width="1" stroke-opacity="0.2"/>
  <text x="300" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="middle">"We sell to mid-market SaaS...</text>
  <text x="300" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="middle">our main competitor is..."</text>

  <!-- Person 4 -->
  <circle cx="130" cy="470" r="18" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1"/>
  <text x="130" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ef4444" text-anchor="middle">PM</text>
  <rect x="170" y="450" width="260" height="40" rx="6" fill="#ef4444" opacity="0.08" stroke="#ef4444" stroke-width="1" stroke-opacity="0.2"/>
  <text x="300" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="middle">"We sell to mid-market SaaS...</text>
  <text x="300" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="middle">our main competitor is..."</text>

  <!-- Evaporate label -->
  <rect x="140" y="530" width="240" height="40" rx="6" fill="#ef4444" opacity="0.1"/>
  <text x="260" y="548" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ef4444" text-anchor="middle">Sessions evaporate</text>
  <text x="260" y="563" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="middle">Start from zero every time</text>

  <!-- Right panel: Repo-based AI -->
  <rect x="520" y="100" width="440" height="560" rx="12" fill="#072A1E" stroke="#4ADE80" stroke-width="1"/>
  <text x="740" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#4ADE80" text-anchor="middle">Repo-based AI</text>
  <text x="740" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888" text-anchor="middle">AI starts from everything the team knows</text>

  <!-- Central repo -->
  <rect x="620" y="200" width="240" height="200" rx="10" fill="#0B3D2E" stroke="#4ADE80" stroke-width="2"/>
  <text x="740" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4ADE80" text-anchor="middle">Repository</text>
  <line x1="640" y1="245" x2="840" y2="245" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.3"/>
  <text x="740" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">Strategy</text>
  <text x="740" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">Research</text>
  <text x="740" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">Decisions</text>
  <text x="740" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">Prompts</text>
  <text x="740" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">Templates</text>
  <text x="740" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">Evidence</text>
  <text x="740" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">History</text>

  <!-- Arrows from repo to AI sessions -->
  <line x1="740" y1="400" x2="620" y2="470" stroke="#4ADE80" stroke-width="1.5"/>
  <line x1="740" y1="400" x2="740" y2="470" stroke="#4ADE80" stroke-width="1.5"/>
  <line x1="740" y1="400" x2="860" y2="470" stroke="#4ADE80" stroke-width="1.5"/>

  <!-- AI session boxes -->
  <rect x="580" y="470" width="80" height="50" rx="6" fill="#4ADE80" opacity="0.15" stroke="#4ADE80" stroke-width="1"/>
  <text x="620" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4ADE80" text-anchor="middle">PM 1</text>
  <text x="620" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#888" text-anchor="middle">+ AI</text>

  <rect x="700" y="470" width="80" height="50" rx="6" fill="#4ADE80" opacity="0.15" stroke="#4ADE80" stroke-width="1"/>
  <text x="740" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4ADE80" text-anchor="middle">PM 2</text>
  <text x="740" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#888" text-anchor="middle">+ AI</text>

  <rect x="820" y="470" width="80" height="50" rx="6" fill="#4ADE80" opacity="0.15" stroke="#4ADE80" stroke-width="1"/>
  <text x="860" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4ADE80" text-anchor="middle">PM 3</text>
  <text x="860" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#888" text-anchor="middle">+ AI</text>

  <!-- Persistent label -->
  <rect x="620" y="560" width="240" height="40" rx="6" fill="#4ADE80" opacity="0.1"/>
  <text x="740" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4ADE80" text-anchor="middle">Same persistent context</text>
  <text x="740" y="593" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="middle">No re-explaining</text>

  <!-- VS divider -->
  <circle cx="500" cy="380" r="24" fill="#0B3D2E" stroke="#4ADE80" stroke-width="2"/>
  <text x="500" y="387" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#4ADE80" text-anchor="middle">vs</text>

  <!-- Bottom takeaway -->
  <rect x="100" y="720" width="800" height="60" rx="10" fill="#072A1E" stroke="#4ADE80" stroke-width="1"/>
  <text x="500" y="755" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">The team and its AI systems work from the same persistent context.</text>

  <text x="960" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4ADE80" opacity="0.5" text-anchor="end">Productside</text>
</svg>
