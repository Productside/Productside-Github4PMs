<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F4D38"/>
      <stop offset="100%" stop-color="#0B3D2E"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" rx="16" fill="url(#glow)"/>

  <!-- Title -->
  <text x="500" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#4ADE80" text-anchor="middle">THE PROBLEM</text>

  <!-- Left panel: Context Rebuilt -->
  <rect x="40" y="100" width="440" height="420" rx="12" fill="#072A1E" stroke="#1a5c40" stroke-width="1"/>
  <text x="260" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ef4444" text-anchor="middle">Context Rebuilt</text>

  <!-- Circular arrows showing rebuild cycle -->
  <circle cx="260" cy="310" r="100" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 4" opacity="0.5"/>
  <!-- Monday boxes around the circle -->
  <rect x="215" y="185" width="90" height="32" rx="6" fill="#ef4444" opacity="0.2"/>
  <text x="260" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ef4444" text-anchor="middle">MONDAY</text>

  <rect x="340" y="275" width="90" height="32" rx="6" fill="#ef4444" opacity="0.2"/>
  <text x="385" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ef4444" text-anchor="middle">REBUILD</text>

  <rect x="215" y="395" width="90" height="32" rx="6" fill="#ef4444" opacity="0.2"/>
  <text x="260" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ef4444" text-anchor="middle">MONDAY</text>

  <rect x="130" y="275" width="90" height="32" rx="6" fill="#ef4444" opacity="0.2"/>
  <text x="175" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ef4444" text-anchor="middle">REBUILD</text>

  <!-- Center label -->
  <text x="260" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#888" text-anchor="middle">same altitude</text>
  <text x="260" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#888" text-anchor="middle">every week</text>

  <text x="260" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#999" text-anchor="middle">Re-explain. Reconstruct. Repeat.</text>

  <!-- Right panel: Context Compounds -->
  <rect x="520" y="100" width="440" height="420" rx="12" fill="#072A1E" stroke="#4ADE80" stroke-width="1"/>
  <text x="740" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#4ADE80" text-anchor="middle">Context Compounds</text>

  <!-- Ascending steps -->
  <rect x="570" y="420" width="100" height="30" rx="4" fill="#4ADE80" opacity="0.15"/>
  <text x="620" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4ADE80" text-anchor="middle">Week 1</text>

  <rect x="630" y="370" width="100" height="30" rx="4" fill="#4ADE80" opacity="0.25"/>
  <text x="680" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4ADE80" text-anchor="middle">Week 2</text>

  <rect x="690" y="320" width="100" height="30" rx="4" fill="#4ADE80" opacity="0.35"/>
  <text x="740" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4ADE80" text-anchor="middle">Week 3</text>

  <rect x="750" y="270" width="100" height="30" rx="4" fill="#4ADE80" opacity="0.45"/>
  <text x="800" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4ADE80" text-anchor="middle">Week 4</text>

  <rect x="810" y="220" width="100" height="30" rx="4" fill="#4ADE80" opacity="0.6"/>
  <text x="860" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4ADE80" text-anchor="middle">Week 5</text>

  <!-- Connecting line -->
  <line x1="620" y1="420" x2="860" y2="220" stroke="#4ADE80" stroke-width="2" stroke-dasharray="6 3" opacity="0.4"/>

  <!-- Arrow up -->
  <polygon points="860,175 850,195 870,195" fill="#4ADE80" opacity="0.8"/>

  <text x="740" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#999" text-anchor="middle">Each week builds on everything before it.</text>

  <!-- Bottom question -->
  <rect x="100" y="570" width="800" height="80" rx="12" fill="#072A1E" stroke="#4ADE80" stroke-width="1"/>
  <text x="500" y="618" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">Which pattern does your team live in?</text>

  <!-- VS divider -->
  <circle cx="500" cy="310" r="24" fill="#0B3D2E" stroke="#4ADE80" stroke-width="2"/>
  <text x="500" y="317" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#4ADE80" text-anchor="middle">vs</text>

  <!-- Footer -->
  <text x="960" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4ADE80" opacity="0.5" text-anchor="end">Productside</text>
</svg>
