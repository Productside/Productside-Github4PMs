<svg viewBox="0 0 1000 600" width="1000" height="600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1000" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="45" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Product tool stack map</text>

  <!-- Top layer: Keep -->
  <text x="100" y="105" font-size="16" fill="#555555" font-weight="bold">KEEP</text>

  <rect x="180" y="80" width="200" height="60" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="280" y="106" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Docs</text>
  <text x="280" y="126" font-size="13" fill="#555555" text-anchor="middle">store</text>

  <rect x="400" y="80" width="200" height="60" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="500" y="106" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Jira</text>
  <text x="500" y="126" font-size="13" fill="#555555" text-anchor="middle">track</text>

  <rect x="620" y="80" width="200" height="60" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="720" y="106" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Slack</text>
  <text x="720" y="126" font-size="13" fill="#555555" text-anchor="middle">talk</text>

  <!-- Connector lines down -->
  <line x1="280" y1="140" x2="280" y2="210" stroke="#999999" stroke-width="1.5"/>
  <line x1="500" y1="140" x2="500" y2="210" stroke="#999999" stroke-width="1.5"/>
  <line x1="720" y1="140" x2="720" y2="210" stroke="#999999" stroke-width="1.5"/>

  <!-- Middle layer: Add -->
  <text x="100" y="250" font-size="16" fill="#0B3D2E" font-weight="bold">ADD</text>

  <rect x="180" y="210" width="640" height="80" rx="10" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="3"/>
  <text x="500" y="248" font-size="22" fill="#0B3D2E" text-anchor="middle" font-weight="bold">GitHub</text>
  <text x="500" y="274" font-size="15" fill="#0B3D2E" text-anchor="middle">version  +  context  +  review  +  AI</text>

  <!-- Arrow down to result -->
  <line x1="500" y1="290" x2="500" y2="360" stroke="#0B3D2E" stroke-width="2"/>
  <polygon points="492,355 500,370 508,355" fill="#0B3D2E"/>

  <!-- Bottom layer: Result -->
  <text x="100" y="405" font-size="16" fill="#555555" font-weight="bold">RESULT</text>

  <rect x="180" y="375" width="640" height="70" rx="10" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="500" y="417" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Versioned context where change needs memory</text>

  <!-- Bottom tagline -->
  <text x="500" y="520" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Use GitHub where change needs memory.</text>

  <!-- Footer -->
  <text x="970" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999" text-anchor="end">Productside</text>
</svg>