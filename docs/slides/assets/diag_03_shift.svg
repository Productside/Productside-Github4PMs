<svg viewBox="0 0 1000 600" width="1000" height="600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1000" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="45" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Filing cabinet vs. living network</text>

  <!-- Left side: Filing cabinet -->
  <rect x="60" y="80" width="380" height="430" rx="12" fill="#fef2f2" stroke="none"/>

  <text x="250" y="115" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="bold">Static archive</text>

  <!-- File drawers stacked -->
  <rect x="120" y="140" width="260" height="44" rx="6" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="250" y="168" font-size="15" fill="#1a1a1a" text-anchor="middle">v1  —  strategy draft</text>

  <rect x="120" y="196" width="260" height="44" rx="6" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="250" y="224" font-size="15" fill="#1a1a1a" text-anchor="middle">v2  —  revised strategy</text>

  <rect x="120" y="252" width="260" height="44" rx="6" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="250" y="280" font-size="15" fill="#1a1a1a" text-anchor="middle">v3  —  strategy FINAL</text>

  <rect x="120" y="308" width="260" height="44" rx="6" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="250" y="336" font-size="15" fill="#1a1a1a" text-anchor="middle">v4  —  strategy FINAL2</text>

  <rect x="120" y="364" width="260" height="44" rx="6" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="250" y="392" font-size="15" fill="#1a1a1a" text-anchor="middle">v5  —  USE THIS ONE</text>

  <!-- Downward arrow -->
  <line x1="250" y1="425" x2="250" y2="470" stroke="#dc2626" stroke-width="2"/>
  <polygon points="242,465 250,480 258,465" fill="#dc2626"/>

  <text x="250" y="500" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">Linear. Disconnected.</text>

  <!-- Right side: Network -->
  <rect x="560" y="80" width="380" height="430" rx="12" fill="#f0fdf4" stroke="none"/>

  <text x="750" y="115" font-size="18" fill="#0B3D2E" text-anchor="middle" font-weight="bold">Living network</text>

  <!-- Network nodes -->
  <!-- Strategy node (center) -->
  <circle cx="750" cy="250" r="36" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="2"/>
  <text x="750" y="255" font-size="13" fill="#0B3D2E" text-anchor="middle" font-weight="bold">Strategy</text>

  <!-- Research node (top-left) -->
  <circle cx="650" cy="170" r="32" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="1.5"/>
  <text x="650" y="175" font-size="12" fill="#1a1a1a" text-anchor="middle">Research</text>

  <!-- Decision node (top-right) -->
  <circle cx="860" cy="180" r="32" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="1.5"/>
  <text x="860" y="185" font-size="12" fill="#1a1a1a" text-anchor="middle">Decision</text>

  <!-- Prompt node (bottom-left) -->
  <circle cx="660" cy="360" r="32" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="1.5"/>
  <text x="660" y="365" font-size="12" fill="#1a1a1a" text-anchor="middle">Prompt</text>

  <!-- Template node (bottom-right) -->
  <circle cx="850" cy="350" r="32" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="1.5"/>
  <text x="850" y="355" font-size="12" fill="#1a1a1a" text-anchor="middle">Template</text>

  <!-- Connection lines -->
  <line x1="682" y1="178" x2="718" y2="228" stroke="#0B3D2E" stroke-width="1.5"/>
  <line x1="832" y1="195" x2="782" y2="232" stroke="#0B3D2E" stroke-width="1.5"/>
  <line x1="690" y1="348" x2="722" y2="280" stroke="#0B3D2E" stroke-width="1.5"/>
  <line x1="822" y1="338" x2="780" y2="275" stroke="#0B3D2E" stroke-width="1.5"/>
  <line x1="670" y1="195" x2="840" y2="325" stroke="#0B3D2E" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="840" y1="205" x2="685" y2="335" stroke="#0B3D2E" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="750" y="450" font-size="15" fill="#0B3D2E" text-anchor="middle" font-weight="bold">Connected. Evolving.</text>

  <!-- Center divider -->
  <line x1="500" y1="100" x2="500" y2="490" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Bottom tagline -->
  <text x="500" y="550" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold">The why stays with the what.</text>

  <!-- Footer -->
  <text x="970" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999" text-anchor="end">Productside</text>
</svg>