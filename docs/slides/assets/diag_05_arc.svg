<svg viewBox="0 0 1000 600" width="1000" height="600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1000" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="45" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Seven-step arc</text>

  <!-- Arc path (gentle upward curve) -->
  <path d="M 80,320 Q 250,280 350,260 Q 500,230 650,210 Q 800,190 920,160" stroke="#0B3D2E" stroke-width="2" fill="none" stroke-dasharray="6,4"/>

  <!-- Step positions along the arc -->
  <!-- Step 1: Share -->
  <circle cx="80" cy="320" r="22" fill="#0B3D2E"/>
  <text x="80" y="326" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">01</text>
  <text x="80" y="360" font-size="16" fill="#0B3D2E" text-anchor="middle" font-weight="bold">Share</text>
  <text x="80" y="380" font-size="12" fill="#555555" text-anchor="middle">One workspace</text>

  <!-- Arrow 1→2 -->
  <line x1="102" y1="316" x2="178" y2="298" stroke="#4ADE80" stroke-width="2"/>
  <polygon points="175,292 185,296 178,304" fill="#4ADE80"/>

  <!-- Step 2: Collaborate -->
  <circle cx="200" cy="295" r="22" fill="#0B3D2E"/>
  <text x="200" y="301" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">02</text>
  <text x="200" y="360" font-size="16" fill="#0B3D2E" text-anchor="middle" font-weight="bold">Collaborate</text>
  <text x="200" y="380" font-size="12" fill="#555555" text-anchor="middle">Safe contribution</text>

  <!-- Arrow 2→3 -->
  <line x1="222" y1="290" x2="298" y2="272" stroke="#4ADE80" stroke-width="2"/>
  <polygon points="295,266 305,270 298,278" fill="#4ADE80"/>

  <!-- Step 3: Review -->
  <circle cx="320" cy="268" r="22" fill="#0B3D2E"/>
  <text x="320" y="274" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">03</text>
  <text x="320" y="360" font-size="16" fill="#0B3D2E" text-anchor="middle" font-weight="bold">Review</text>
  <text x="320" y="380" font-size="12" fill="#555555" text-anchor="middle">Challenge changes</text>

  <!-- Arrow 3→4 -->
  <line x1="342" y1="262" x2="418" y2="248" stroke="#4ADE80" stroke-width="2"/>
  <polygon points="415,242 425,246 418,254" fill="#4ADE80"/>

  <!-- Step 4: Trace -->
  <circle cx="440" cy="245" r="22" fill="#0B3D2E"/>
  <text x="440" y="251" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">04</text>
  <text x="440" y="360" font-size="16" fill="#0B3D2E" text-anchor="middle" font-weight="bold">Trace</text>
  <text x="440" y="380" font-size="12" fill="#555555" text-anchor="middle">Decision memory</text>

  <!-- Arrow 4→5 -->
  <line x1="462" y1="238" x2="538" y2="224" stroke="#4ADE80" stroke-width="2"/>
  <polygon points="535,218 545,222 538,230" fill="#4ADE80"/>

  <!-- Step 5: Experiment -->
  <circle cx="560" cy="220" r="22" fill="#0B3D2E"/>
  <text x="560" y="226" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">05</text>
  <text x="560" y="360" font-size="16" fill="#0B3D2E" text-anchor="middle" font-weight="bold">Experiment</text>
  <text x="560" y="380" font-size="12" fill="#555555" text-anchor="middle">Parallel realities</text>

  <!-- Arrow 5→6 -->
  <line x1="582" y1="214" x2="658" y2="200" stroke="#4ADE80" stroke-width="2"/>
  <polygon points="655,194 665,198 658,206" fill="#4ADE80"/>

  <!-- Step 6: Augment -->
  <circle cx="680" cy="196" r="22" fill="#0B3D2E"/>
  <text x="680" y="202" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">06</text>
  <text x="680" y="360" font-size="16" fill="#0B3D2E" text-anchor="middle" font-weight="bold">Augment</text>
  <text x="680" y="380" font-size="12" fill="#555555" text-anchor="middle">Team AI context</text>

  <!-- Arrow 6→7 -->
  <line x1="702" y1="190" x2="778" y2="176" stroke="#4ADE80" stroke-width="2"/>
  <polygon points="775,170 785,174 778,182" fill="#4ADE80"/>

  <!-- Step 7: Reuse -->
  <circle cx="800" cy="172" r="22" fill="#0B3D2E"/>
  <text x="800" y="178" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">07</text>
  <text x="800" y="360" font-size="16" fill="#0B3D2E" text-anchor="middle" font-weight="bold">Reuse</text>
  <text x="800" y="380" font-size="12" fill="#555555" text-anchor="middle">Reusable assets</text>

  <!-- Dashed lines from labels to nodes -->
  <line x1="80" y1="347" x2="80" y2="342" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="200" y1="347" x2="200" y2="317" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="320" y1="347" x2="320" y2="290" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="440" y1="347" x2="440" y2="267" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="560" y1="347" x2="560" y2="242" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="680" y1="347" x2="680" y2="218" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="800" y1="347" x2="800" y2="194" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Bottom tagline -->
  <text x="500" y="450" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold">GitHub manages evolving context.</text>

  <!-- Footer -->
  <text x="970" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999" text-anchor="end">Productside</text>
</svg>