  <text x="500" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ef4444" text-anchor="middle">Tribal Knowledge</text>
  <text x="500" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888" text-anchor="middle">Something one person figured out once</text>

  <!-- Heads with thought bubbles -->
  <circle cx="200" cy="230" r="30" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1"/>
  <text x="200" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ef4444" text-anchor="middle">PM 1</text>
  <rect x="145" y="180" width="110" height="28" rx="14" fill="#ef4444" opacity="0.08" stroke="#ef4444" stroke-width="1" stroke-opacity="0.2"/>
  <text x="200" y="199" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#888" text-anchor="middle">research template</text>

  <circle cx="380" cy="230" r="30" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1"/>
  <text x="380" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ef4444" text-anchor="middle">PM 2</text>
  <rect x="320" y="180" width="120" height="28" rx="14" fill="#ef4444" opacity="0.08" stroke="#ef4444" stroke-width="1" stroke-opacity="0.2"/>
  <text x="380" y="199" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#888" text-anchor="middle">evaluation criteria</text>

  <circle cx="560" cy="230" r="30" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1"/>
  <text x="560" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ef4444" text-anchor="middle">PM 3</text>
  <rect x="505" y="180" width="110" height="28" rx="14" fill="#ef4444" opacity="0.08" stroke="#ef4444" stroke-width="1" stroke-opacity="0.2"/>
  <text x="560" y="199" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#888" text-anchor="middle">good AI prompt</text>

  <circle cx="740" cy="230" r="30" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1"/>
  <text x="740" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ef4444" text-anchor="middle">PM 4</text>
  <rect x="685" y="180" width="110" height="28" rx="14" fill="#ef4444" opacity="0.08" stroke="#ef4444" stroke-width="1" stroke-opacity="0.2"/>
  <text x="740" y="199" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#888" text-anchor="middle">launch checklist</text>

  <!-- Disconnected label -->
  <text x="500" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888" text-anchor="middle">Each practice lives in someone's head or a personal document.</text>
  <text x="500" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888" text-anchor="middle">When they leave, the practice leaves with them.</text>

  <!-- Arrow down -->
  <line x1="500" y1="390" x2="500" y2="460" stroke="#4ADE80" stroke-width="2"/>
  <polygon points="500,470 494,458 506,458" fill="#4ADE80"/>
  <text x="540" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="start">versioned + structured</text>

