  <rect x="120" y="560" width="170" height="120" rx="8" fill="#0B3D2E" stroke="#4ADE80" stroke-width="1"/>
  <rect x="120" y="560" width="170" height="30" rx="8" fill="#4ADE80" opacity="0.15"/>
  <text x="205" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">Templates</text>
  <text x="205" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">research-brief.md</text>
  <text x="205" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">competitive-scan.md</text>
  <text x="205" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">launch-checklist.md</text>
  <text x="205" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4ADE80" text-anchor="middle">v3.2 · 14 contributors</text>

  <rect x="320" y="560" width="170" height="120" rx="8" fill="#0B3D2E" stroke="#4ADE80" stroke-width="1"/>
  <rect x="320" y="560" width="170" height="30" rx="8" fill="#4ADE80" opacity="0.15"/>
  <text x="405" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">Prompts</text>
  <text x="405" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">market-analysis.md</text>
  <text x="405" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">user-interview.md</text>
  <text x="405" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">feature-eval.md</text>
  <text x="405" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4ADE80" text-anchor="middle">v2.0 · 8 contributors</text>

  <rect x="520" y="560" width="170" height="120" rx="8" fill="#0B3D2E" stroke="#4ADE80" stroke-width="1"/>
  <rect x="520" y="560" width="170" height="30" rx="8" fill="#4ADE80" opacity="0.15"/>
  <text x="605" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">Criteria</text>
  <text x="605" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">go-no-go.md</text>
  <text x="605" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">vendor-eval.md</text>
  <text x="605" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">prioritization.md</text>
  <text x="605" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4ADE80" text-anchor="middle">v1.4 · 6 contributors</text>

  <rect x="720" y="560" width="170" height="120" rx="8" fill="#0B3D2E" stroke="#4ADE80" stroke-width="1"/>
  <rect x="720" y="560" width="170" height="30" rx="8" fill="#4ADE80" opacity="0.15"/>
  <text x="805" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">Skills</text>
  <text x="805" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">CLAUDE.md</text>
  <text x="805" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">CONSTITUTION.md</text>
  <text x="805" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#ccc" text-anchor="middle">workflows/</text>
  <text x="805" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4ADE80" text-anchor="middle">v4.1 · 11 contributors</text>

  <!-- Adoption arrow -->
  <text x="500" y="740" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888" text-anchor="middle">Versioned. Reviewable. Improvable by anyone on the team.</text>

  <!-- Bottom takeaway -->
  <rect x="150" y="850" width="700" height="60" rx="10" fill="#072A1E" stroke="#4ADE80" stroke-width="1"/>
  <text x="500" y="885" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Practices stop being "something one person figured out once."</text>

  <text x="960" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4ADE80" opacity="0.5" text-anchor="end">Productside</text>
</svg>
