  <rect x="80" y="480" width="840" height="320" rx="12" fill="#072A1E" stroke="#4ADE80" stroke-width="1"/>
  <text x="500" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#4ADE80" text-anchor="middle">Team Infrastructure</text>
  <text x="500" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888" text-anchor="middle">Assets another PM or team can adopt, improve, and build on</text>

