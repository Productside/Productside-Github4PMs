<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" rx="16" fill="#0B3D2E"/>

  <text x="500" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#4ADE80" text-anchor="middle">07 · REUSE</text>

  <!-- Top: Tribal knowledge (before) -->
