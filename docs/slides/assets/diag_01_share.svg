<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" rx="16" fill="#0B3D2E"/>

  <text x="500" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#4ADE80" text-anchor="middle">01 · SHARE</text>

  <!-- Left: Scattered -->
  <rect x="40" y="100" width="440" height="500" rx="12" fill="#072A1E" stroke="#1a5c40" stroke-width="1"/>
  <text x="260" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#ef4444" text-anchor="middle">Scattered across six tools</text>

  <!-- Tool boxes scattered -->
  <rect x="80" y="170" width="130" height="44" rx="6" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <text x="145" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ef4444" text-anchor="middle">Research in Drive</text>

  <rect x="250" y="180" width="130" height="44" rx="6" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <text x="315" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ef4444" text-anchor="middle">Chat in Slack</text>

  <rect x="100" y="250" width="150" height="44" rx="6" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <text x="175" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ef4444" text-anchor="middle">AI session in Claude</text>

  <rect x="280" y="260" width="150" height="44" rx="6" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <text x="355" y="287" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ef4444" text-anchor="middle">Decision in email</text>

  <rect x="70" y="330" width="140" height="44" rx="6" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <text x="140" y="357" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ef4444" text-anchor="middle">PRD in Confluence</text>

  <rect x="240" y="340" width="180" height="44" rx="6" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <text x="330" y="367" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ef4444" text-anchor="middle">Slides in PowerPoint</text>

  <!-- Disconnected lines -->
  <line x1="210" y1="214" x2="250" y2="230" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
  <line x1="250" y1="294" x2="210" y2="310" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>

  <!-- Result -->
  <rect x="120" y="420" width="280" height="50" rx="8" fill="#ef4444" opacity="0.1"/>
  <text x="260" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ef4444" text-anchor="middle">Context rebuilt every Monday</text>

  <text x="260" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888" text-anchor="middle">Each piece disconnected</text>
  <text x="260" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888" text-anchor="middle">from the others.</text>

  <!-- Right: Shared -->
  <rect x="520" y="100" width="440" height="500" rx="12" fill="#072A1E" stroke="#4ADE80" stroke-width="1"/>
  <text x="740" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#4ADE80" text-anchor="middle">One shared workspace</text>

  <!-- Repository container -->
  <rect x="570" y="170" width="340" height="340" rx="10" fill="#0B3D2E" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.6"/>
  <text x="740" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#4ADE80" text-anchor="middle" opacity="0.7">REPOSITORY</text>

  <!-- Connected items inside -->
  <rect x="600" y="215" width="130" height="36" rx="6" fill="#4ADE80" opacity="0.15"/>
  <text x="665" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">Research</text>

  <rect x="750" y="215" width="130" height="36" rx="6" fill="#4ADE80" opacity="0.15"/>
  <text x="815" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">Strategy</text>

  <rect x="600" y="270" width="130" height="36" rx="6" fill="#4ADE80" opacity="0.15"/>
  <text x="665" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">Decisions</text>

  <rect x="750" y="270" width="130" height="36" rx="6" fill="#4ADE80" opacity="0.15"/>
  <text x="815" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">Requirements</text>

  <rect x="600" y="325" width="130" height="36" rx="6" fill="#4ADE80" opacity="0.15"/>
  <text x="665" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">Prompts</text>

  <rect x="750" y="325" width="130" height="36" rx="6" fill="#4ADE80" opacity="0.15"/>
  <text x="815" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">Templates</text>

  <rect x="600" y="380" width="280" height="36" rx="6" fill="#4ADE80" opacity="0.15"/>
  <text x="740" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">Supporting Evidence</text>

  <!-- Connecting lines inside -->
  <line x1="730" y1="233" x2="750" y2="233" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="730" y1="288" x2="750" y2="288" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="730" y1="343" x2="750" y2="343" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="665" y1="251" x2="665" y2="270" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="815" y1="251" x2="815" y2="270" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="665" y1="306" x2="665" y2="325" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="815" y1="306" x2="815" y2="325" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="665" y1="361" x2="665" y2="380" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="815" y1="361" x2="815" y2="380" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Result -->
  <rect x="600" y="440" width="280" height="50" rx="8" fill="#4ADE80" opacity="0.1"/>
  <text x="740" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#4ADE80" text-anchor="middle">Context compounds over time</text>

  <text x="740" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888" text-anchor="middle">Everything connected</text>
  <text x="740" y="588" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888" text-anchor="middle">and findable.</text>

  <!-- VS divider -->
  <circle cx="500" cy="350" r="24" fill="#0B3D2E" stroke="#4ADE80" stroke-width="2"/>
  <text x="500" y="357" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#4ADE80" text-anchor="middle">vs</text>

  <!-- Footer -->
  <text x="960" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4ADE80" opacity="0.5" text-anchor="end">Productside</text>
</svg>
