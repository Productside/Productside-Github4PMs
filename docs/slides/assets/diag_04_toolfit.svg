<svg viewBox="0 0 1000 600" width="1000" height="600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1000" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="45" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Tool landscape map</text>

  <!-- Column headers -->
  <text x="100" y="90" font-size="14" fill="#555555" text-anchor="start" font-weight="bold">TOOL</text>
  <text x="370" y="90" font-size="14" fill="#555555" text-anchor="start" font-weight="bold">STRENGTH</text>
  <text x="700" y="90" font-size="14" fill="#555555" text-anchor="start" font-weight="bold">GAP</text>

  <!-- Row 1: SharePoint/Drive -->
  <rect x="50" y="105" width="900" height="70" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="100" y="146" font-size="16" fill="#1a1a1a" font-weight="bold">SharePoint / Drive</text>
  <text x="370" y="146" font-size="15" fill="#555555">Stores files</text>
  <text x="700" y="146" font-size="15" fill="#dc2626">No change explanation</text>

  <!-- Row 2: Confluence -->
  <rect x="50" y="185" width="900" height="70" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="100" y="226" font-size="16" fill="#1a1a1a" font-weight="bold">Confluence</text>
  <text x="370" y="226" font-size="15" fill="#555555">Reference pages</text>
  <text x="700" y="226" font-size="15" fill="#dc2626">Divorced from work</text>

  <!-- Row 3: Jira -->
  <rect x="50" y="265" width="900" height="70" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="100" y="306" font-size="16" fill="#1a1a1a" font-weight="bold">Jira</text>
  <text x="370" y="306" font-size="15" fill="#555555">Tracks delivery</text>
  <text x="700" y="306" font-size="15" fill="#dc2626">Too heavy for discovery</text>

  <!-- Row 4: AI Projects -->
  <rect x="50" y="345" width="900" height="70" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="100" y="386" font-size="16" fill="#1a1a1a" font-weight="bold">AI Projects</text>
  <text x="370" y="386" font-size="15" fill="#555555">Explores ideas</text>
  <text x="700" y="386" font-size="15" fill="#dc2626">Context trapped in sessions</text>

  <!-- Row 5: GitHub (highlighted) -->
  <rect x="50" y="425" width="900" height="70" rx="8" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="2.5"/>
  <text x="100" y="466" font-size="16" fill="#0B3D2E" font-weight="bold">GitHub</text>
  <text x="370" y="466" font-size="15" fill="#0B3D2E" font-weight="bold">Versions change with context</text>
  <text x="700" y="466" font-size="15" fill="#555555">UI learning curve</text>

  <!-- Bottom tagline -->
  <text x="500" y="545" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Don't move everything. Move the right work.</text>

  <!-- Footer -->
  <text x="970" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999" text-anchor="end">Productside</text>
</svg>