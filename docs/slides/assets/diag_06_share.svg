<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <rect width="1000" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle">Scattered Tools vs. Shared Workspace</text>

  <!-- Left panel: Scattered (red/bad) -->
  <rect x="30" y="70" width="440" height="440" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="250" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#dc2626" text-anchor="middle">Scattered Across Six Tools</text>

  <!-- Scattered tool boxes -->
  <rect x="60" y="130" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="135" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#dc2626" text-anchor="middle">Research in Drive</text>

  <rect x="260" y="125" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="335" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#dc2626" text-anchor="middle">Chat in Slack</text>

  <rect x="80" y="200" width="155" height="40" rx="8" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="158" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#dc2626" text-anchor="middle">AI session in Claude</text>

  <rect x="275" y="205" width="165" height="40" rx="8" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="358" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#dc2626" text-anchor="middle">Decision in email</text>

  <rect x="55" y="275" width="165" height="40" rx="8" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="138" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#dc2626" text-anchor="middle">PRD in Confluence</text>

  <rect x="260" y="280" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="350" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#dc2626" text-anchor="middle">Slides in PowerPoint</text>

  <!-- Dashed disconnection lines -->
  <line x1="210" y1="155" x2="260" y2="145" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="235" y1="220" x2="275" y2="220" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="170" y1="275" x2="260" y2="295" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="135" y1="170" x2="140" y2="200" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="355" y1="165" x2="358" y2="205" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Result label -->
  <rect x="100" y="350" width="300" height="44" rx="8" fill="#FFFFFF" stroke="#dc2626" stroke-width="1"/>
  <text x="250" y="377" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#dc2626" text-anchor="middle">Context rebuilt every Monday</text>

  <text x="250" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#555555" text-anchor="middle">Each piece disconnected from the others.</text>

  <!-- VS divider -->
  <circle cx="500" cy="290" r="26" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="2"/>
  <text x="500" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0B3D2E" text-anchor="middle">vs</text>

  <!-- Right panel: Shared workspace (green/good) -->
  <rect x="530" y="70" width="440" height="440" rx="8" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="1.5"/>
  <text x="750" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0B3D2E" text-anchor="middle">One Shared Workspace</text>

  <!-- Repository container -->
  <rect x="570" y="125" width="360" height="300" rx="8" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="2"/>
  <text x="750" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#0B3D2E" text-anchor="middle">REPOSITORY</text>
  <line x1="590" y1="165" x2="910" y2="165" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Connected items inside, 2 columns -->
  <rect x="595" y="180" width="150" height="36" rx="8" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="1"/>
  <text x="670" y="203" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0B3D2E" text-anchor="middle">Research</text>

  <rect x="765" y="180" width="150" height="36" rx="8" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="1"/>
  <text x="840" y="203" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0B3D2E" text-anchor="middle">Strategy</text>

  <rect x="595" y="230" width="150" height="36" rx="8" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="1"/>
  <text x="670" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0B3D2E" text-anchor="middle">Decisions</text>

  <rect x="765" y="230" width="150" height="36" rx="8" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="1"/>
  <text x="840" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0B3D2E" text-anchor="middle">Requirements</text>

  <rect x="595" y="280" width="150" height="36" rx="8" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="1"/>
  <text x="670" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0B3D2E" text-anchor="middle">Prompts</text>

  <rect x="765" y="280" width="150" height="36" rx="8" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="1"/>
  <text x="840" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0B3D2E" text-anchor="middle">Templates</text>

  <rect x="595" y="330" width="320" height="36" rx="8" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="1"/>
  <text x="755" y="353" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#0B3D2E" text-anchor="middle">Supporting Evidence</text>

  <!-- Connector lines between items -->
  <line x1="745" y1="198" x2="765" y2="198" stroke="#999999" stroke-width="1"/>
  <line x1="745" y1="248" x2="765" y2="248" stroke="#999999" stroke-width="1"/>
  <line x1="745" y1="298" x2="765" y2="298" stroke="#999999" stroke-width="1"/>
  <line x1="670" y1="216" x2="670" y2="230" stroke="#999999" stroke-width="1"/>
  <line x1="840" y1="216" x2="840" y2="230" stroke="#999999" stroke-width="1"/>
  <line x1="670" y1="266" x2="670" y2="280" stroke="#999999" stroke-width="1"/>
  <line x1="840" y1="266" x2="840" y2="280" stroke="#999999" stroke-width="1"/>
  <line x1="670" y1="316" x2="670" y2="330" stroke="#999999" stroke-width="1"/>
  <line x1="840" y1="316" x2="840" y2="330" stroke="#999999" stroke-width="1"/>

  <!-- Result label -->
  <rect x="600" y="440" width="300" height="44" rx="8" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="1"/>
  <text x="750" y="467" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#0B3D2E" text-anchor="middle">Context compounds over time</text>

  <!-- Bottom summary -->
  <rect x="200" y="530" width="600" height="44" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="500" y="558" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a" text-anchor="middle">Everything connected and findable.</text>

  <!-- Footer -->
  <text x="970" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999" text-anchor="end">Productside</text>
</svg>