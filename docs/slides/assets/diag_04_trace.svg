<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" rx="16" fill="#0B3D2E"/>

  <text x="500" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#4ADE80" text-anchor="middle">04 · TRACE</text>

  <!-- Timeline vertical line -->
  <line x1="160" y1="100" x2="160" y2="820" stroke="#4ADE80" stroke-width="2" opacity="0.4"/>

  <!-- Entry 1: Assumption -->
  <circle cx="160" cy="150" r="10" fill="#4ADE80" opacity="0.3" stroke="#4ADE80" stroke-width="2"/>
  <rect x="220" y="110" width="700" height="100" rx="10" fill="#072A1E" stroke="#1a5c40" stroke-width="1"/>
  <text x="250" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#888" text-anchor="start">JAN 15</text>
  <text x="250" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#f59e0b" text-anchor="start">Assumption recorded</text>
  <text x="250" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ccc" text-anchor="start">"Enterprise buyers need single sign-on before they will evaluate us."</text>
  <rect x="750" y="135" width="120" height="24" rx="4" fill="#f59e0b" opacity="0.15"/>
  <text x="810" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">ASSUMPTION</text>

  <!-- Entry 2: Research -->
  <circle cx="160" cy="300" r="10" fill="#4ADE80" opacity="0.5" stroke="#4ADE80" stroke-width="2"/>
  <rect x="220" y="260" width="700" height="100" rx="10" fill="#072A1E" stroke="#1a5c40" stroke-width="1"/>
  <text x="250" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#888" text-anchor="start">FEB 8</text>
  <text x="250" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#60a5fa" text-anchor="start">Research added</text>
  <text x="250" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ccc" text-anchor="start">"Interview 12 of 15: SSO came up unprompted in 3 conversations, not 12."</text>
  <rect x="750" y="285" width="120" height="24" rx="4" fill="#60a5fa" opacity="0.15"/>
  <text x="810" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">EVIDENCE</text>

  <!-- Entry 3: Challenge -->
  <circle cx="160" cy="450" r="10" fill="#4ADE80" opacity="0.7" stroke="#4ADE80" stroke-width="2"/>
  <rect x="220" y="410" width="700" height="100" rx="10" fill="#072A1E" stroke="#1a5c40" stroke-width="1"/>
  <text x="250" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#888" text-anchor="start">FEB 22</text>
  <text x="250" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ef4444" text-anchor="start">Assumption challenged</text>
  <text x="250" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ccc" text-anchor="start">"Data does not support SSO as a gating requirement. Downgrading priority."</text>
  <rect x="750" y="435" width="120" height="24" rx="4" fill="#ef4444" opacity="0.15"/>
  <text x="810" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ef4444" text-anchor="middle">REVISION</text>

  <!-- Entry 4: Decision -->
  <circle cx="160" cy="600" r="10" fill="#4ADE80" stroke="#4ADE80" stroke-width="2"/>
  <rect x="220" y="560" width="700" height="100" rx="10" fill="#072A1E" stroke="#4ADE80" stroke-width="1"/>
  <text x="250" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#888" text-anchor="start">MAR 5</text>
  <text x="250" y="615" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#4ADE80" text-anchor="start">Decision made</text>
  <text x="250" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ccc" text-anchor="start">"SSO moved to Q3. API integrations prioritized based on interview data."</text>
  <rect x="750" y="585" width="120" height="24" rx="4" fill="#4ADE80" opacity="0.15"/>
  <text x="810" y="602" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4ADE80" text-anchor="middle">DECISION</text>

  <!-- Connection labels -->
  <text x="160" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4ADE80" text-anchor="middle" opacity="0.6">each linked</text>
  <text x="160" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4ADE80" text-anchor="middle" opacity="0.6">to the one</text>
  <text x="160" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4ADE80" text-anchor="middle" opacity="0.6">before it</text>

  <!-- Bottom takeaway -->
  <rect x="160" y="720" width="760" height="70" rx="10" fill="#072A1E" stroke="#4ADE80" stroke-width="1"/>
  <text x="540" y="750" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Every change carries a mandatory written message explaining why.</text>
  <text x="540" y="775" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888" text-anchor="middle">That requirement alone changes behavior.</text>

  <text x="960" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4ADE80" opacity="0.5" text-anchor="end">Productside</text>
</svg>
