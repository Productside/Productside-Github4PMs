<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <rect width="1000" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle">Session-based vs. Repo-based AI</text>

  <!-- Left panel: Session-based AI (red/bad) -->
  <rect x="30" y="70" width="440" height="440" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="250" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#dc2626" text-anchor="middle">Session-based AI</text>
  <text x="250" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#555555" text-anchor="middle">Every person re-explains the product</text>

  <!-- Person 1 with AI bubble -->
  <circle cx="100" cy="190" r="20" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="100" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#dc2626" text-anchor="middle">PM</text>
  <rect x="140" y="170" width="290" height="38" rx="8" fill="#FFFFFF" stroke="#dc2626" stroke-width="1"/>
  <text x="285" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">"We sell to mid-market SaaS..."</text>

  <!-- Person 2 with AI bubble -->
  <circle cx="100" cy="260" r="20" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="100" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#dc2626" text-anchor="middle">PM</text>
  <rect x="140" y="240" width="290" height="38" rx="8" fill="#FFFFFF" stroke="#dc2626" stroke-width="1"/>
  <text x="285" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">"We sell to mid-market SaaS..."</text>

  <!-- Person 3 with AI bubble -->
  <circle cx="100" cy="330" r="20" fill="#FFFFFF" stroke="#dc2626" stroke-width="1.5"/>
  <text x="100" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#dc2626" text-anchor="middle">PM</text>
  <rect x="140" y="310" width="290" height="38" rx="8" fill="#FFFFFF" stroke="#dc2626" stroke-width="1"/>
  <text x="285" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle">"We sell to mid-market SaaS..."</text>

  <!-- Evaporate label -->
  <rect x="100" y="400" width="300" height="44" rx="8" fill="#FFFFFF" stroke="#dc2626" stroke-width="1"/>
  <text x="250" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#dc2626" text-anchor="middle">Sessions evaporate</text>
  <text x="250" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#555555" text-anchor="middle">Start from zero every time</text>

  <!-- VS divider -->
  <circle cx="500" cy="290" r="26" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="2"/>
  <text x="500" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0B3D2E" text-anchor="middle">vs</text>

  <!-- Right panel: Repo-based AI (green/good) -->
  <rect x="530" y="70" width="440" height="440" rx="8" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="1.5"/>
  <text x="750" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0B3D2E" text-anchor="middle">Repo-based AI</text>
  <text x="750" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#555555" text-anchor="middle">AI starts from everything the team knows</text>

  <!-- Central repository box -->
  <rect x="620" y="150" width="260" height="170" rx="8" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="2"/>
  <text x="750" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0B3D2E" text-anchor="middle">Repository</text>
  <line x1="640" y1="190" x2="860" y2="190" stroke="#e0e0e0" stroke-width="1"/>
  <text x="750" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#555555" text-anchor="middle">Strategy</text>
  <text x="750" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#555555" text-anchor="middle">Research + Decisions</text>
  <text x="750" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#555555" text-anchor="middle">Prompts + Templates</text>
  <text x="750" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#555555" text-anchor="middle">Evidence + History</text>
  <text x="750" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0B3D2E" text-anchor="middle">shared context</text>

  <!-- Arrows from repo to PM+AI sessions -->
  <line x1="680" y1="320" x2="630" y2="380" stroke="#0B3D2E" stroke-width="1.5"/>
  <line x1="750" y1="320" x2="750" y2="380" stroke="#0B3D2E" stroke-width="1.5"/>
  <line x1="820" y1="320" x2="870" y2="380" stroke="#0B3D2E" stroke-width="1.5"/>
  <polygon points="630,380 624,368 636,368" fill="#0B3D2E"/>
  <polygon points="750,380 744,368 756,368" fill="#0B3D2E"/>
  <polygon points="870,380 864,368 876,368" fill="#0B3D2E"/>

  <!-- PM + AI session boxes -->
  <rect x="590" y="385" width="80" height="50" rx="8" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="1.5"/>
  <text x="630" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0B3D2E" text-anchor="middle">PM 1</text>
  <text x="630" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555555" text-anchor="middle">+ AI</text>

  <rect x="710" y="385" width="80" height="50" rx="8" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="1.5"/>
  <text x="750" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0B3D2E" text-anchor="middle">PM 2</text>
  <text x="750" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555555" text-anchor="middle">+ AI</text>

  <rect x="830" y="385" width="80" height="50" rx="8" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="1.5"/>
  <text x="870" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0B3D2E" text-anchor="middle">PM 3</text>
  <text x="870" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555555" text-anchor="middle">+ AI</text>

  <!-- Persistent context label -->
  <rect x="620" y="460" width="260" height="36" rx="8" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="1"/>
  <text x="750" y="483" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0B3D2E" text-anchor="middle">Same persistent context</text>

  <!-- Bottom takeaway -->
  <rect x="150" y="530" width="700" height="44" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="500" y="558" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a" text-anchor="middle">The team and its AI work from the same persistent context.</text>

  <!-- Footer -->
  <text x="970" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999" text-anchor="end">Productside</text>
</svg>