<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" rx="16" fill="#0B3D2E"/>

  <text x="500" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#4ADE80" text-anchor="middle">05 · EXPERIMENT</text>

  <!-- Main branch -->
  <line x1="80" y1="200" x2="920" y2="200" stroke="#4ADE80" stroke-width="3"/>
  <text x="80" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4ADE80">main</text>
  <text x="80" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888">The trusted version. Untouched.</text>

  <!-- Commit dots on main -->
  <circle cx="200" cy="200" r="8" fill="#4ADE80"/>
  <circle cx="400" cy="200" r="8" fill="#4ADE80"/>
  <circle cx="800" cy="200" r="8" fill="#4ADE80"/>

  <!-- Branch A: Strategy direction 1 -->
  <line x1="200" y1="200" x2="240" y2="350" stroke="#60a5fa" stroke-width="2"/>
  <line x1="240" y1="350" x2="560" y2="350" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="300" cy="350" r="6" fill="#60a5fa"/>
  <circle cx="400" cy="350" r="6" fill="#60a5fa"/>
  <circle cx="500" cy="350" r="6" fill="#60a5fa"/>

  <rect x="240" y="300" width="260" height="30" rx="6" fill="#60a5fa" opacity="0.15"/>
  <text x="370" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#60a5fa" text-anchor="middle">Direction A: Go upmarket</text>

  <!-- Branch B: Strategy direction 2 -->
  <line x1="200" y1="200" x2="240" y2="500" stroke="#f59e0b" stroke-width="2"/>
  <line x1="240" y1="500" x2="560" y2="500" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="300" cy="500" r="6" fill="#f59e0b"/>
  <circle cx="400" cy="500" r="6" fill="#f59e0b"/>

  <rect x="240" y="450" width="260" height="30" rx="6" fill="#f59e0b" opacity="0.15"/>
  <text x="370" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="middle">Direction B: Platform play</text>

  <!-- Branch C: Strategy direction 3 -->
  <line x1="400" y1="200" x2="440" y2="650" stroke="#a78bfa" stroke-width="2"/>
  <line x1="440" y1="650" x2="560" y2="650" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="500" cy="650" r="6" fill="#a78bfa"/>

  <rect x="440" y="600" width="260" height="30" rx="6" fill="#a78bfa" opacity="0.15"/>
  <text x="570" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="middle">Direction C: New vertical</text>

  <!-- Merge: only A merges back -->
  <line x1="560" y1="350" x2="800" y2="200" stroke="#4ADE80" stroke-width="2"/>
  <polygon points="800,200 785,210 790,195" fill="#4ADE80"/>

  <!-- Parked labels for B and C -->
  <rect x="560" y="485" width="80" height="30" rx="6" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="600" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">parked</text>

  <rect x="560" y="635" width="80" height="30" rx="6" fill="#a78bfa" opacity="0.1" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.3"/>
  <text x="600" y="655" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">parked</text>

  <!-- Annotation for merge -->
  <rect x="700" y="130" width="200" height="46" rx="6" fill="#4ADE80" opacity="0.1" stroke="#4ADE80" stroke-width="1"/>
  <text x="800" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle">Parts that survived</text>
  <text x="800" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4ADE80" text-anchor="middle">merge back in</text>

  <!-- Key insight box -->
  <rect x="100" y="760" width="800" height="120" rx="12" fill="#072A1E" stroke="#4ADE80" stroke-width="1"/>
  <text x="500" y="800" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Three competing strategies explored in parallel.</text>
  <text x="500" y="830" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">The trusted version never changed until someone chose.</text>
  <text x="500" y="860" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#888" text-anchor="middle">No duplicate files. No crossed fingers. No "which version is the real one?"</text>

  <text x="960" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4ADE80" opacity="0.5" text-anchor="end">Productside</text>
</svg>
