<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <rect width="1000" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle">Assumption to Decision Timeline</text>

  <!-- Timeline vertical line -->
  <line x1="120" y1="75" x2="120" y2="510" stroke="#0B3D2E" stroke-width="2"/>

  <!-- Entry 1: Assumption recorded -->
  <circle cx="120" cy="110" r="10" fill="#FFFFFF" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="170" y="80" width="780" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="195" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#555555">JAN 15</text>
  <text x="310" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#dc2626">Assumption recorded</text>
  <text x="195" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#1a1a1a">"Enterprise buyers need single sign-on before they will evaluate us."</text>

  <!-- Entry 2: Research challenges it -->
  <circle cx="120" cy="220" r="10" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="2.5"/>
  <rect x="170" y="190" width="780" height="70" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="195" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#555555">FEB 8</text>
  <text x="280" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0B3D2E">Research added</text>
  <text x="195" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#1a1a1a">"Interview 12 of 15: SSO came up unprompted in 3 conversations, not 12."</text>

  <!-- Entry 3: Team discusses -->
  <circle cx="120" cy="330" r="10" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="2.5"/>
  <rect x="170" y="300" width="780" height="70" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="195" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#555555">FEB 22</text>
  <text x="305" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0B3D2E">Assumption challenged</text>
  <text x="195" y="352" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#1a1a1a">"Data does not support SSO as a gating requirement. Downgrading priority."</text>

  <!-- Entry 4: Decision made -->
  <circle cx="120" cy="440" r="10" fill="#FFFFFF" stroke="#4ADE80" stroke-width="2.5"/>
  <circle cx="120" cy="440" r="5" fill="#4ADE80"/>
  <rect x="170" y="410" width="780" height="70" rx="8" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="1.5"/>
  <text x="195" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#555555">MAR 5</text>
  <text x="290" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0B3D2E">Decision made</text>
  <text x="195" y="462" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#1a1a1a">"SSO moved to Q3. API integrations prioritized based on interview data."</text>

  <!-- Tags on right side -->
  <rect x="835" y="88" width="110" height="26" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="890" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#dc2626" text-anchor="middle">ASSUMPTION</text>

  <rect x="835" y="198" width="110" height="26" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="890" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#555555" text-anchor="middle">EVIDENCE</text>

  <rect x="835" y="308" width="110" height="26" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="890" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#555555" text-anchor="middle">REVISION</text>

  <rect x="835" y="418" width="110" height="26" rx="8" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="1"/>
  <text x="890" y="436" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0B3D2E" text-anchor="middle">DECISION</text>

  <!-- Bottom takeaway -->
  <rect x="150" y="520" width="700" height="50" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="500" y="541" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a" text-anchor="middle">Every step is findable later.</text>
  <text x="500" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#555555" text-anchor="middle">Each change carries a mandatory written message explaining why.</text>

  <!-- Footer -->
  <text x="970" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999" text-anchor="end">Productside</text>
</svg>