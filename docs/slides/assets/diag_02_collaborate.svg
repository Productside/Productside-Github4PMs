<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" rx="16" fill="#0B3D2E"/>

  <text x="500" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#4ADE80" text-anchor="middle">02 · COLLABORATE</text>

  <!-- Entry point -->
  <rect x="350" y="100" width="300" height="60" rx="10" fill="#4ADE80" opacity="0.2" stroke="#4ADE80" stroke-width="2"/>
  <text x="500" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#4ADE80" text-anchor="middle">Your team has an idea</text>
  <text x="500" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888" text-anchor="middle">Something worth exploring</text>

  <!-- Arrow down to fork -->
  <line x1="500" y1="160" x2="500" y2="220" stroke="#4ADE80" stroke-width="2"/>
  <polygon points="500,230 494,218 506,218" fill="#4ADE80"/>

  <!-- Fork diamond -->
  <polygon points="500,240 560,280 500,320 440,280" fill="#072A1E" stroke="#4ADE80" stroke-width="2"/>
  <text x="500" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#4ADE80" text-anchor="middle">Still a</text>
  <text x="500" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#4ADE80" text-anchor="middle">question?</text>

  <!-- Left branch: Discussion -->
  <line x1="440" y1="280" x2="240" y2="280" stroke="#60a5fa" stroke-width="2"/>
  <line x1="240" y1="280" x2="240" y2="380" stroke="#60a5fa" stroke-width="2"/>
  <polygon points="240,390 234,378 246,378" fill="#60a5fa"/>

  <text x="340" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#60a5fa" text-anchor="middle">YES</text>

  <rect x="100" y="400" width="280" height="280" rx="12" fill="#072A1E" stroke="#60a5fa" stroke-width="2"/>
  <text x="240" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#60a5fa" text-anchor="middle">Discussion</text>
  <text x="240" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#60a5fa" opacity="0.6" text-anchor="middle">EXPLORE</text>

  <line x1="140" y1="480" x2="340" y2="480" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>

  <text x="240" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ccc" text-anchor="middle">"Should we do something</text>
  <text x="240" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ccc" text-anchor="middle">about this?"</text>

  <rect x="140" y="560" width="200" height="30" rx="6" fill="#60a5fa" opacity="0.1"/>
  <text x="240" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">Open-ended debate</text>

  <rect x="140" y="600" width="200" height="30" rx="6" fill="#60a5fa" opacity="0.1"/>
  <text x="240" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">No commitment yet</text>

  <rect x="140" y="640" width="200" height="30" rx="6" fill="#60a5fa" opacity="0.1"/>
  <text x="240" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">Costs nothing to start</text>

  <!-- Right branch: Issue -->
  <line x1="560" y1="280" x2="760" y2="280" stroke="#f59e0b" stroke-width="2"/>
  <line x1="760" y1="280" x2="760" y2="380" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="760,390 754,378 766,378" fill="#f59e0b"/>

  <text x="660" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="middle">NO</text>

  <rect x="620" y="400" width="280" height="280" rx="12" fill="#072A1E" stroke="#f59e0b" stroke-width="2"/>
  <text x="760" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f59e0b" text-anchor="middle">Issue</text>
  <text x="760" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#f59e0b" opacity="0.6" text-anchor="middle">COMMIT</text>

  <line x1="660" y1="480" x2="860" y2="480" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>

  <text x="760" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ccc" text-anchor="middle">"We have decided to</text>
  <text x="760" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ccc" text-anchor="middle">investigate or change."</text>

  <rect x="660" y="560" width="200" height="30" rx="6" fill="#f59e0b" opacity="0.1"/>
  <text x="760" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">Assignable</text>

  <rect x="660" y="600" width="200" height="30" rx="6" fill="#f59e0b" opacity="0.1"/>
  <text x="760" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">Trackable</text>

  <rect x="660" y="640" width="200" height="30" rx="6" fill="#f59e0b" opacity="0.1"/>
  <text x="760" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">Closable</text>

  <!-- Conversion arrow -->
  <line x1="380" y1="540" x2="620" y2="540" stroke="#4ADE80" stroke-width="1" stroke-dasharray="6 3" opacity="0.5"/>
  <polygon points="620,540 608,534 608,546" fill="#4ADE80" opacity="0.5"/>
  <text x="500" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4ADE80" text-anchor="middle" opacity="0.7">converts when ready</text>

  <!-- Bottom takeaway -->
  <rect x="200" y="740" width="600" height="60" rx="10" fill="#072A1E" stroke="#4ADE80" stroke-width="1"/>
  <text x="500" y="775" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Both are attached to the work, not floating in a chat feed.</text>

  <text x="960" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4ADE80" opacity="0.5" text-anchor="end">Productside</text>
</svg>
