  <line x1="720" y1="135" x2="600" y2="250" stroke="#999999" stroke-width="1.5"/>

  <!-- Requirements (bottom-left) -->
  <rect x="120" y="380" width="160" height="50" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="200" y="411" font-size="16" fill="#1a1a1a" text-anchor="middle">Requirements</text>
  <line x1="280" y1="405" x2="400" y2="310" stroke="#999999" stroke-width="1.5"/>

  <!-- Prompts (bottom-center) -->
  <rect x="420" y="390" width="160" height="50" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
