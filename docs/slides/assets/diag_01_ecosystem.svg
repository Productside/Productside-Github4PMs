  <line x1="500" y1="150" x2="500" y2="230" stroke="#999999" stroke-width="1.5"/>

  <!-- Decisions (top-right) -->
  <rect x="720" y="110" width="160" height="50" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
