  <text x="500" y="72" font-size="16" fill="#555555" text-anchor="middle">Not code. Context.</text>

  <!-- Central hub -->
  <rect x="400" y="230" width="200" height="80" rx="12" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="3"/>
  <text x="500" y="278" font-size="22" fill="#0B3D2E" text-anchor="middle" font-weight="bold">Repository</text>

  <!-- Spoke items -->
  <!-- Strategy (top-left) -->
  <rect x="120" y="110" width="160" height="50" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="200" y="141" font-size="16" fill="#1a1a1a" text-anchor="middle">Strategy</text>
  <line x1="280" y1="135" x2="400" y2="250" stroke="#999999" stroke-width="1.5"/>

  <!-- Research (top-center) -->
  <rect x="420" y="100" width="160" height="50" rx="8" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1.5"/>
