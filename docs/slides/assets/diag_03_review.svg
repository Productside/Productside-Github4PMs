<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" rx="16" fill="#0B3D2E"/>

  <text x="500" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#4ADE80" text-anchor="middle">03 · REVIEW</text>

  <!-- Main branch line -->
  <line x1="100" y1="200" x2="900" y2="200" stroke="#4ADE80" stroke-width="3"/>
  <text x="100" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4ADE80" text-anchor="start">main</text>
  <text x="100" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="start">The accepted version</text>

  <!-- Commit dots on main -->
  <circle cx="200" cy="200" r="8" fill="#4ADE80"/>
  <circle cx="800" cy="200" r="8" fill="#4ADE80"/>

  <!-- Branch off -->
  <line x1="200" y1="200" x2="250" y2="350" stroke="#60a5fa" stroke-width="2"/>
  <line x1="250" y1="350" x2="650" y2="350" stroke="#60a5fa" stroke-width="2"/>
  <text x="250" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#60a5fa" text-anchor="start">proposed change</text>

  <!-- Commits on branch -->
  <circle cx="300" cy="350" r="6" fill="#60a5fa"/>
  <circle cx="400" cy="350" r="6" fill="#60a5fa"/>
  <circle cx="500" cy="350" r="6" fill="#60a5fa"/>

  <!-- Commit labels -->
  <text x="300" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="middle">edit</text>
  <text x="400" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="middle">revise</text>
  <text x="500" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888" text-anchor="middle">refine</text>

  <!-- Pull Request box -->
  <rect x="560" y="300" width="200" height="100" rx="10" fill="#072A1E" stroke="#f59e0b" stroke-width="2"/>
  <text x="660" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#f59e0b" text-anchor="middle">PULL REQUEST</text>
  <line x1="580" y1="345" x2="740" y2="345" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  <text x="660" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ccc" text-anchor="middle">See the diff</text>
  <text x="660" y="383" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ccc" text-anchor="middle">Discuss line by line</text>

  <!-- Review panel -->
  <rect x="200" y="450" width="600" height="260" rx="12" fill="#072A1E" stroke="#1a5c40" stroke-width="1"/>
  <text x="500" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">The Review</text>

  <!-- Diff view mockup -->
  <rect x="240" y="510" width="520" height="30" rx="4" fill="#ef4444" opacity="0.08"/>
  <text x="260" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ef4444" text-anchor="start">- Our target market is enterprise SaaS companies</text>

  <rect x="240" y="545" width="520" height="30" rx="4" fill="#4ADE80" opacity="0.08"/>
  <text x="260" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4ADE80" text-anchor="start">+ Our target market is mid-market SaaS (200-2000 seats)</text>

  <!-- Comment -->
  <rect x="260" y="585" width="480" height="40" rx="6" fill="#60a5fa" opacity="0.1" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.3"/>
  <text x="280" y="610" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#60a5fa" text-anchor="start">VP Product: "Do we have data supporting the 200 floor?"</text>

  <!-- Approval indicators -->
  <rect x="240" y="640" width="160" height="36" rx="6" fill="#4ADE80" opacity="0.15"/>
  <text x="320" y="663" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#4ADE80" text-anchor="middle">Approved</text>

  <rect x="420" y="640" width="160" height="36" rx="6" fill="#f59e0b" opacity="0.15"/>
  <text x="500" y="663" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="middle">Changes requested</text>

  <rect x="600" y="640" width="160" height="36" rx="6" fill="#ef4444" opacity="0.15"/>
  <text x="680" y="663" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ef4444" text-anchor="middle">Blocked</text>

  <!-- Merge arrow -->
  <line x1="760" y1="350" x2="800" y2="200" stroke="#4ADE80" stroke-width="2" stroke-dasharray="6 3"/>
  <polygon points="800,200 790,215 805,210" fill="#4ADE80"/>
  <text x="810" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#4ADE80" text-anchor="middle" transform="rotate(-60 810 280)">merge</text>

  <!-- Gate label -->
  <rect x="750" y="140" width="140" height="36" rx="6" fill="#4ADE80" opacity="0.15" stroke="#4ADE80" stroke-width="1"/>
  <text x="820" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#4ADE80" text-anchor="middle">Now it is truth</text>

  <!-- Bottom takeaway -->
  <rect x="200" y="760" width="600" height="60" rx="10" fill="#072A1E" stroke="#4ADE80" stroke-width="1"/>
  <text x="500" y="795" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Review is a gate, not a ritual.</text>

  <text x="960" y="980" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4ADE80" opacity="0.5" text-anchor="end">Productside</text>
</svg>
