<svg viewBox="0 0 1000 600" width="1000" height="600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1000" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="500" y="45" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Scattered artifacts vs. shared ground</text>

  <!-- Left side: chaos cloud -->
  <rect x="40" y="80" width="400" height="400" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- Messy overlapping rectangles -->
  <rect x="80" y="130" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#dc2626" stroke-width="1" transform="rotate(-8, 140, 150)"/>
  <text x="140" y="156" font-size="14" fill="#dc2626" text-anchor="middle" transform="rotate(-8, 140, 150)">Drive</text>

  <rect x="170" y="110" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#dc2626" stroke-width="1" transform="rotate(5, 230, 130)"/>
  <text x="230" y="136" font-size="14" fill="#dc2626" text-anchor="middle" transform="rotate(5, 230, 130)">Slack</text>

  <rect x="290" y="140" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#dc2626" stroke-width="1" transform="rotate(-3, 350, 160)"/>
  <text x="350" y="166" font-size="14" fill="#dc2626" text-anchor="middle" transform="rotate(-3, 350, 160)">Email</text>

  <rect x="100" y="220" width="130" height="40" rx="6" fill="#FFFFFF" stroke="#dc2626" stroke-width="1" transform="rotate(6, 165, 240)"/>
  <text x="165" y="246" font-size="14" fill="#dc2626" text-anchor="middle" transform="rotate(6, 165, 240)">Confluence</text>

  <rect x="250" y="210" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#dc2626" stroke-width="1" transform="rotate(-10, 320, 230)"/>
  <text x="320" y="236" font-size="14" fill="#dc2626" text-anchor="middle" transform="rotate(-10, 320, 230)">PowerPoint</text>

  <rect x="150" y="310" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#dc2626" stroke-width="1" transform="rotate(4, 210, 330)"/>
  <text x="210" y="336" font-size="14" fill="#dc2626" text-anchor="middle" transform="rotate(4, 210, 330)">Claude</text>

  <!-- Dashed disconnection lines -->
  <line x1="160" y1="170" x2="200" y2="110" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="260" y1="150" x2="300" y2="200" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="180" y1="260" x2="260" y2="210" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="230" y1="310" x2="310" y2="250" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="240" y="430" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="bold">Where does this break?</text>

  <!-- Center divider -->
  <text x="500" y="295" font-size="28" fill="#555555" text-anchor="middle" font-weight="bold">vs</text>

  <!-- Right side: organized repo -->
  <rect x="560" y="80" width="400" height="400" rx="12" fill="#f0fdf4" stroke="#0B3D2E" stroke-width="1"/>

  <rect x="610" y="120" width="300" height="60" rx="8" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="2"/>
  <text x="760" y="158" font-size="20" fill="#0B3D2E" text-anchor="middle" font-weight="bold">Repository</text>

  <!-- Organized items inside -->
  <rect x="630" y="210" width="260" height="36" rx="6" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="760" y="234" font-size="14" fill="#1a1a1a" text-anchor="middle">strategy.md</text>

  <rect x="630" y="258" width="260" height="36" rx="6" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="760" y="282" font-size="14" fill="#1a1a1a" text-anchor="middle">research/findings/</text>

  <rect x="630" y="306" width="260" height="36" rx="6" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="760" y="330" font-size="14" fill="#1a1a1a" text-anchor="middle">decisions/</text>

  <rect x="630" y="354" width="260" height="36" rx="6" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="760" y="378" font-size="14" fill="#1a1a1a" text-anchor="middle">prompts/</text>

  <text x="760" y="430" font-size="16" fill="#0B3D2E" text-anchor="middle" font-weight="bold">Shared ground</text>

  <!-- Bottom tagline -->
  <text x="500" y="540" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Context decay is a product tax.</text>

  <!-- Footer -->
  <text x="970" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#999" text-anchor="end">Productside</text>
</svg>