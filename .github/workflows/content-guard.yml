# Content Guard
#
# Rejects material that should not enter this repository:
#   1. configured blocked terms sourced from a repository or organization
#      secret, never from a file in the tree
#   2. binary document formats that do not belong in a lightweight reference repo
#   3. oversized files that make every clone slower forever
#   4. anything that looks like a credential
#
# Configure the blocked-term secret in GitHub repository or organization
# settings. Keep sensitive term lists out of the repository.

name: Content Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which files changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
            fi
          fi
          git diff --name-only --diff-filter=ACMR "$BASE" "$HEAD" > /tmp/changed.txt || true
          echo "Files changed:"
          cat /tmp/changed.txt

      - name: Reject binary document formats
        run: |
          BAD=$(grep -iE '\.(docx?|pptx?|xlsx?|pdf|msg|eml)$' /tmp/changed.txt || true)
          if [ -n "$BAD" ]; then
            echo "::error::These binary document formats do not belong in this reference repo:"
            echo "$BAD"
            echo ""
            echo "Keep large editable documents in the team's document system"
            echo "and link to approved public resources when needed."
            exit 1
          fi
          echo "No blocked binary document formats found."

      - name: Reject oversized files
        run: |
          LIMIT=5000000   # 5 MB
          FAIL=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            SIZE=$(wc -c < "$f")
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error::$f is $SIZE bytes, over the ${LIMIT}-byte limit."
              FAIL=1
            fi
          done < /tmp/changed.txt
          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "Large files make every clone slower for everyone."
            echo "Keep them in the team's document system and link to approved"
            echo "public resources when needed."
            exit 1
          fi
          echo "No oversized files."

      - name: Reject blocked terms
        env:
          BLOCKED_TERMS: ${{ secrets.BLOCKED_TERMS }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "$BLOCKED_TERMS" ]; then
            if [ "$IS_PRIVATE" != "true" ] && [ "$IS_FORK_PR" != "true" ]; then
              echo "::error::Required blocked-term checking is not configured."
              echo "Configure the repository or organization secret used by this workflow."
              exit 1
            fi
            echo "::warning::Blocked-term checking is not configured."
            echo "Configure the repository or organization secret used by this workflow."
            exit 0
          fi
          FAIL=0
          while IFS= read -r term; do
            [ -z "$term" ] && continue
            case "$term" in \#*) continue ;; esac
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              case "$f" in *blocked-terms*) continue ;; esac
              if grep -qiF -- "$term" "$f"; then
                echo "::error::$f contains a blocked term."
                FAIL=1
              fi
            done < /tmp/changed.txt
          done <<< "$BLOCKED_TERMS"
          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "A blocked term matched this change. Remove it or get"
            echo "explicit approval before proceeding."
            exit 1
          fi
          echo "No blocked terms found."

      - name: Reject anything that looks like a credential
        run: |
          PATTERN='(sk-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          FAIL=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in *.env.example|*.sample|*content-guard*|*blocked-terms*) continue ;; esac
            if grep -qElr "$PATTERN" "$f" 2>/dev/null; then
              echo "::error::$f appears to contain a credential."
              FAIL=1
            fi
          done < /tmp/changed.txt
          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "If a real credential reached this branch, treat it as an"
            echo "incident: rotate the key first, then remove it."
            exit 1
          fi
          echo "No credential patterns found."
